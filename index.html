<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a1a" />
  <title>Neon Drift Rush - Free Online Dodge Game</title>
  <meta name="description" content="Neon Drift Rush is a fast endless dodge game. Steer through neon obstacles, beat your high score, and challenge your friends. Free, no download, instant play." />
  <!-- Open Graph: rich previews when the challenge/share link is posted -->
  <meta property="og:title" content="Neon Drift Rush - Can you beat my score?" />
  <meta property="og:description" content="Steer through neon traffic, chase the high score, challenge your friends. Instant play, no download." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game-root">
    <!-- animated ambient background layers (pure CSS, cheap) -->
    <div class="bg-fx" aria-hidden="true">
      <div class="bg-grid"></div>
      <div class="bg-glow bg-glow-1"></div>
      <div class="bg-glow bg-glow-2"></div>
    </div>

    <canvas id="game-canvas"></canvas>

    <!-- Loading -->
    <div id="loading-screen" class="overlay">
      <div class="logo logo-xl">NEON<span>DRIFT</span>RUSH</div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
      <div class="loader-tip">Tip: hug the gaps for near-miss combos</div>
    </div>

    <!-- Main Menu -->
    <div id="menu-screen" class="overlay hidden">
      <div class="logo logo-xl">NEON<span>DRIFT</span>RUSH</div>

      <!-- challenge banner appears only when arriving via a friend's link -->
      <div id="challenge-banner" class="challenge-banner hidden">
        <div class="cb-icon">&#9876;&#65039;</div>
        <div class="cb-text"><b id="cb-name">A friend</b> challenged you to beat <b id="cb-score">0</b> m</div>
      </div>

      <div class="menu-best">Best <b id="menu-best-score">0</b> m</div>

      <button id="play-btn" class="btn btn-primary btn-glow">PLAY</button>

      <div class="menu-row">
        <button id="leaderboard-btn" class="btn btn-ghost">&#127942; RANKS</button>
        <button id="skins-btn" class="btn btn-ghost">&#127912; SKINS</button>
        <button id="mute-btn" class="btn btn-ghost icon-btn" aria-label="sound">&#128266;</button>
      </div>

      <div class="streak-pill" id="streak-pill">&#128293; Day streak: <b id="streak-count">1</b></div>
    </div>

    <!-- In-game HUD -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-score"><span id="hud-distance">0</span><small>m</small></div>
        <div class="hud-coins">&#9679; <span id="hud-coins">0</span></div>
        <button id="pause-btn" class="hud-pause" aria-label="pause">&#10073;&#10073;</button>
      </div>
      <!-- live "chase" marker: shows the score you're trying to beat -->
      <div id="chase-tag" class="chase-tag hidden"></div>
      <div id="tutorial-hint" class="tutorial-hint hidden">
        <div class="finger">&#128072;</div>
        <div class="tut-text">Steer to dodge</div>
      </div>
      <div id="combo-popup" class="combo-popup"></div>
    </div>

    <!-- Pause -->
    <div id="pause-screen" class="overlay hidden">
      <div class="panel">
        <h2>PAUSED</h2>
        <button id="resume-btn" class="btn btn-primary">RESUME</button>
        <button id="quit-btn" class="btn btn-ghost">QUIT</button>
      </div>
    </div>

    <!-- Game Over -->
    <div id="gameover-screen" class="overlay hidden">
      <div class="panel panel-go">
        <h2 id="go-title">CRASHED!</h2>

        <!-- social proof line -->
        <div id="go-proof" class="go-proof">You beat <b>0%</b> of players</div>

        <div class="go-stats">
          <div class="go-stat"><span class="go-label">SCORE</span><span id="go-score" class="go-val">0</span></div>
          <div class="go-stat"><span class="go-label">BEST</span><span id="go-best" class="go-val">0</span></div>
          <div class="go-stat"><span class="go-label">RANK</span><span id="go-rank" class="go-val">#-</span></div>
        </div>

        <div id="go-newbest" class="go-newbest hidden">&#11088; NEW BEST! &#11088;</div>

        <!-- challenge result line (only when arrived via a challenge) -->
        <div id="go-challenge-result" class="go-challenge-result hidden"></div>

        <div id="go-coins" class="go-coins">&#9679; +0</div>

        <button id="retry-btn" class="btn btn-primary">RETRY</button>
        <button id="revive-btn" class="btn btn-reward hidden">&#9654; REVIVE (Ad)</button>

        <!-- VIRAL row: the marketing engine -->
        <div class="viral-row">
          <button id="challenge-btn" class="btn btn-share">&#9876;&#65039; CHALLENGE A FRIEND</button>
          <button id="share-btn" class="btn btn-ghost">&#128228; SHARE</button>
        </div>

        <button id="menu-btn" class="btn btn-ghost">MENU</button>
      </div>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboard-screen" class="overlay hidden">
      <div class="panel">
        <h2>&#127942; RANKS</h2>
        <div id="leaderboard-list" class="lb-list"></div>
        <button id="lb-challenge-btn" class="btn btn-share">&#9876;&#65039; CHALLENGE A FRIEND</button>
        <button id="lb-back-btn" class="btn btn-ghost">BACK</button>
      </div>
    </div>

    <!-- Skins -->
    <div id="skins-screen" class="overlay hidden">
      <div class="panel">
        <h2>&#127912; SKINS</h2>
        <div class="coins-bal">&#9679; <span id="skins-coins">0</span></div>
        <div id="skins-grid" class="skins-grid"></div>
        <button id="skins-back-btn" class="btn btn-ghost">BACK</button>
      </div>
    </div>

    <!-- Achievement toast -->
    <div id="ach-toast" class="ach-toast hidden">
      <div class="ach-icon">&#127894;</div>
      <div class="ach-body"><div class="ach-title">Achievement!</div><div id="ach-desc" class="ach-desc"></div></div>
    </div>

    <!-- Generic toast (share copied, etc.) -->
    <div id="info-toast" class="info-toast hidden"></div>
  </div>

  <!-- Scripts: ordered, no build step -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/viral.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/input.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/player.js"></script>
  <script src="js/world.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
